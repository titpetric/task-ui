services:
  runner:
    image: titpetric/task-ui
    restart: always
    environment:
      # Users sign in from /app/.htpasswd: `task-ui passwd <user>` adds one.
      # The roles: these names are admins, these viewers, the rest runners.
      TASK_UI_ADMINS: ${TASK_UI_ADMINS:-admin}
      TASK_UI_VIEWERS: ${TASK_UI_VIEWERS:-}
    ports:
    - 3000:3000
    volumes:
    - $PWD/app:/app
    - $PWD/data:/data
    - $PWD/root/.ssh:/root/.ssh
    - /var/run/docker.sock:/var/run/docker.sock:ro
