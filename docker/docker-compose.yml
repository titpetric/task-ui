services:
  runner:
    image: titpetric/task-ui
    restart: always
    # Users sign in from /data/.htpasswd: `task-ui passwd <user>` adds one.
    # The folders with jobs go in /data/workspaces, the keys in /keys.
    # The first users of an empty database are admins; `task-ui user`
    # sets the roles after.
    ports:
    - 3000:3000
    volumes:
    - $PWD/data:/data
    - $PWD/keys:/keys
    # /go holds what /app/entrypoint.d installs, task and atkins, and the
    # module cache they are built from. Without it every restart downloads
    # and rebuilds them, which is minutes before the instance answers.
    - gopath:/go
    # How a job reaches a docker daemon, and how it authenticates to a
    # registry. docs/running.md#docker-and-registries has the three
    # arrangements; this is the first, and the least isolated.
    - /var/run/docker.sock:/var/run/docker.sock:ro
    # The host's registry logins, for a job that pushes an image. The
    # Docker Registry integration runs `docker login` into the same file,
    # so leaving this out keeps the logins inside the container.
    #
    # Mount the DIRECTORY. A single-file mount makes every credential
    # change a silent no-op: the CLI renames a temp file over the config,
    # the rename answers EBUSY on a bind-mounted file, and the CLI
    # discards the error and reports success. `:ro` changes nothing.
    # - $HOME/.docker:/app/.docker

volumes:
  gopath:
