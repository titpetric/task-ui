services:
  runner:
    image: titpetric/task-ui
    restart: always
    environment:
      # Signs the session cookie, keep sessions across restarts.
      TASK_UI_SECRET: ${TASK_UI_SECRET:-change-me}
      # Users are seeded from /app/task-ui.yml; without users nobody can sign in.
    ports:
    - 3000:3000
    volumes:
    - $PWD/app:/app
    - $PWD/data:/data
    - $PWD/root/.ssh:/root/.ssh
    - /var/run/docker.sock:/var/run/docker.sock:ro
