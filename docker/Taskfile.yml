---
version: "3"
desc: "Build and test docker release assets"

vars:
  image: titpetric/task-ui
  root:
    sh: git rev-parse --show-toplevel || echo .

tasks:
  build:
    desc: "Build task-ui docker image"
    dir: '{{ .root }}'
    cmds:
      - docker build -t {{ .image }} -f docker/Dockerfile .
      - docker images | grep {{ .image }}

  gen:
    desc: "Generate an ssh key for the key folder, ./keys"
    dir: '{{ .root }}/docker'
    cmds:
      - mkdir -p -m 700 ./keys
      - ssh-keygen -t ed25519 -N '' -f ./keys/id_ed25519 -C task-ui
      - cat ./keys/id_ed25519.pub

  run:
    desc: "Run task-ui in docker env"
    dir: '{{ .root }}/docker'
    cmds:
      - docker compose up
