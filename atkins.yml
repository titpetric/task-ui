#!/usr/bin/env atkins
# Atkins: https://github.com/titpetric/atkins

name: task-ui tests

jobs:
  test:
    desc: "Run the unit tests"
    steps:
      - env GOFLAGS=-p=1 GOMAXPROCS=2 GOMEMLIMIT=2GiB go test -cover ./...

  test:integration:
    desc: "Run the integration tests: processes, databases and the network"
    steps:
      - env GOFLAGS=-p=1 GOMAXPROCS=2 GOMEMLIMIT=2GiB go test -tags integration -count=1 ./...

  deploy:
    desc: "Deploy docs to cdn.si"
    vars:
      stage: $(mktemp -d)
    passthru: true
    cmds:
      - rsync -a ./README.md ./docs ${{stage}}/
      - rsync -aiP -e 'ssh -p 8022' ${{stage}}/ titpetric@cdn.si:/task-ui/
