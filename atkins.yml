#!/usr/bin/env atkins
# Atkins: https://github.com/titpetric/atkins

name: task-ui tests

# Every go command here runs under the same bounds. A test binary that grows
# past GOMEMLIMIT is collected rather than killed, and -p=1 with two procs
# keeps one package building or running at a time, so the peak is one package
# and not all of them.
env:
  vars:
    GOFLAGS: -p=1
    GOMAXPROCS: "2"
    GOMEMLIMIT: 2GiB

jobs:
  # ci:push, ci:pr and ci:daily are the three names task-ui looks for in a
  # pipeline, and a folder that declares one is a folder task-ui can trigger
  # for itself: a push or a pull request through the Forgejo integration, a
  # schedule for the daily. The names are the whole interface. What each one
  # runs is this file's business and task-ui never reads inside them.
  #
  # Which trigger each answers, and what that means for what belongs in it:
  #
  #   ci:push   the default branch moved, by a merge or by a plain push.
  #             The whole gate, because some commits are read by nothing
  #             else, and then the image.
  #   ci:pr     a pull request opened or pushed to. The same gate, with
  #             nothing published.
  #   ci:daily  a schedule. What a push is too slow to carry. The runner
  #             pulls before every run, so no git step belongs here.
  #
  # A project not on Forgejo gets ci:daily and nothing else: there is no hook
  # to install, and the daily pulls with the instance key like any other run.
  # A commit reaches main without a pull request, so this is the full gate
  # and not a lighter one: it is the only thing some commits are read by.
  ci:push:
    desc: "CI on a push to the default branch: the whole gate, then the image"
    cmds:
      - task: lint
      - task: test
      - task: front
      - task: ci:image

  # The same gate as ci:push, publishing nothing. A branch that lands by
  # merge is read twice and a branch that lands by push once, and both
  # readings are this.
  ci:pr:
    desc: "CI on a pull request: the whole gate, publishing nothing"
    cmds:
      - task: lint
      - task: test
      - task: front

  # The suites every push is too slow to carry: the integration tests build
  # and run a binary per package, and the budget rots one test at a time.
  # The gate itself is not here, because every push already ran it.
  ci:daily:
    desc: "CI on a schedule: the integration suite and the per-test budget"
    cmds:
      - task: test:budget
      - task: test:integration

  # The release image, tagged with the commit as well as latest so a running
  # container names what it is. `docker push` needs a login this job does not
  # make: the registry credentials are the instance's, as a secret of the
  # folder, and a job that logs in would put them in its own terminal.
  ci:image:
    desc: "Build the release image and push it to titpetric/task-ui"
    vars:
      image: titpetric/task-ui
      sha: $(git rev-parse --short HEAD)
    steps:
      - docker build -t ${{image}}:${{sha}} -t ${{image}}:latest -f docker/Dockerfile .
      - docker push ${{image}}:${{sha}}
      - docker push ${{image}}:latest

  # What a change has to pass, and nothing that takes minutes. The prose gate
  # and the unit suite together are under a minute on a cold cache.
  #
  # test:integration is deliberately out. It builds and runs a binary per
  # package, a few of them serving a whole instance, and it answers a question
  # about the drivers rather than about the change. Run it by name, or for the
  # package a change touched: `atkins test:integration`, or
  # `scripts/test-integration.sh ./storage/...`.
  default:
    desc: "The fast gate: the unit tests and the front end"
    cmds:
      - task: test
      - task: front

  # The front end being ported, which has a pipeline of its own: format,
  # lint, its .phpt fixtures, the precompiled templates and the conventions.
  # docs/phpfront.md is the contract it holds.
  front:
    desc: "Run the phpscript front end's pipeline"
    dir: phpfront/app
    steps:
      - atkins

  test:
    desc: "Run the unit tests"
    steps:
      - go test ./...

  # What a change needs: the packages it touched, the packages that import
  # them, and a budget. A test over a second is waiting on something it
  # could be told about, and the run names it rather than leaving it to be
  # noticed a year later. `scripts/test.sh --all` is every package.
  test:scope:
    desc: "Run the tests of what changed, inside the 1s per test budget"
    steps:
      - ./scripts/test.sh

  test:budget:
    desc: "Fail on any test over a second, over every package"
    steps:
      - ./scripts/test.sh --all

  test:cover:
    desc: "Report unit test coverage per package"
    steps:
      - go test -cover ./...

  # Which function each test covers, and which two tests cover the same
  # lines: the report that says what to merge.
  test:duplicate:
    desc: "Report the coverage two tests share"
    steps:
      - ./scripts/test-duplicate.sh

  test:integration:
    desc: "Run the integration tests: the storage package over a throwaway database"
    steps:
      - ./scripts/test-integration.sh

  # What each suite costs and what each suite covers, side by side, and
  # the coverage of all of them together. The screenshot suites count
  # because their server is built with `go build -cover`.
  test:coverage:
    desc: "Report every suite's duration and coverage, and the merged total"
    steps:
      - ./scripts/test-coverage.sh

  # Two of these gate and one reports. The CI targets run this on every
  # push, so a step that fails on a finding the tree has carried for months
  # would fail every push and gate nothing, the way lint:docs would.
  lint:
    desc: "Lint the Go source, the permission rules and the conventions"
    steps:
      # splint prints and does not fail: `splint ./...` is 559 findings on
      # this tree, most of them coverage and prose. Drop the `|| true` the
      # day the count reaches zero, and the count is why it is printed on
      # every push. `atkins go:lint` is the same report under its own name.
      - splint ./... || true
      - go run ./internal/cmd/rulelint
      # Every rule under rules/ was written at zero and is proven to
      # fire, so --error is right: a finding is a new violation.
      # rules/SKILL.md says what they hold and how to add one.
      - semgrep scan --metrics=off --quiet --error --config rules .

  # Run by name, after adding a migration anywhere. It is out of default
  # because it writes generated files and needs mig and sqlite3 on the path.
  #
  # The global schema skill is what this replaces. That one applies
  # `schema/*.up.sql`, and there is no such file any more: a migration lives
  # with the code that owns its table, under `phpfront/app/modules/<name>/
  # schema/`, `keystore/schema/`, `access/schema/` or `phpscript/schema/`.
  # `mig migrate --recursive` finds all four and merges them flat, keyed by
  # base name, the way app.Migrations does for the binary - and the base names
  # are the order the migrations need. schema/schema.go is the contract.
  schema:
    desc: "Apply the migrations to a throwaway database and regenerate the data model"
    steps:
      - ./scripts/schema.sh

  # What the cutover reads: every view that answers from phpscript leaves a
  # marker on the Go handler it replaced, and the last one to go is the one
  # that drops the prefix. A count of zero is a front end that is finished.
  front:markers:
    desc: "List the Go code a ported view has marked for deletion"
    steps:
      - |
        git grep -n "TODO: delete, replaced with phpscript" -- '*.go' '*.tpl' || {
            echo "nothing is marked yet"
            exit 0
        }

  # Run by name, never from default: the tree is not at zero yet, and a
  # job that fails on every run gates nothing. vale reads the markdown and
  # the templates whole, and the comments out of the Go, PHP, JavaScript
  # and CSS; the style is llm-slop, vendored under .vale/styles, so it
  # needs no network. git decides which files it reads, and .vale.ini
  # decides which of those are read for prose: the composer tree under
  # phpfront/app/ext is committed, so the glob cannot skip it.
  lint:docs:
    desc: "Report the prose findings: markdown, the templates, and the comments of the Go, PHP, JS and CSS"
    steps:
      - git ls-files --cached --others --exclude-standard | grep -E '\.(md|go|php|js|css|tpl)$' | xargs -r vale

  # The editor the markdown fields are drawn with, vendored beside xterm's
  # bundle because this front end has no node toolchain: what is in the
  # folder is what the browser receives. mdedit commits its own dist/, so a
  # refresh is a copy out of a checkout of it.
  mdedit:
    desc: "Refresh the vendored markdown editor from a checkout of mdedit"
    vars:
      mdedit: ../mdedit
    steps:
      - cp ${{mdedit}}/dist/mdedit.global.js phpfront/app/theme/assets/vendor/mdedit.js
      - cp ${{mdedit}}/dist/mdedit.min.css phpfront/app/theme/assets/vendor/mdedit.css
      - cp ${{mdedit}}/LICENSE phpfront/app/theme/assets/vendor/mdedit.LICENSE

  deploy:
    desc: "Deploy docs to cdn.si"
    vars:
      stage: $(mktemp -d)
    passthru: true
    cmds:
      - rsync -a ./README.md ./docs ${{stage}}/
      - rsync -aiP -e 'ssh -p 8022' ${{stage}}/ titpetric@cdn.si:/task-ui/
