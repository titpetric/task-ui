# The suite root of this application's tests.
#
# phpscript test roots a fixture at the directory the fixture sits in, which
# would put tests/ out of reach of ext/ and code/. This moves that root here,
# to the tree root: a fixture requires "ext/autoload.php" and means the path
# an endpoint means.
#
# The database is one in-memory SQLite shared by name across the process, so
# the setup hook's schema is the schema every fixture opens. The connection is
# the one Task\DB names, so a storage class under test opens its own
# connection the way a page does and nothing in code/ knows it is a test.
env:
  - "PLATFORM_DB_TASK-UI=sqlite://file:phpfront?mode=memory&cache=shared"

test:
  include: tests/bootstrap.php
  hooks:
    setup: tests/setup.php
