ruleslint {
  name: TaskUI php app structure

  dir {
    modules
    theme
  }

  dir modules {
    artifacts/
    dashboard/
    folders/
    inventory/
    refinement/
    runs/
    schedules/
    settings/
    threads/
    user/
    workflows/
  }

  dir theme {
    assets/
    templates/
    templates_c/

    # The catch-all answers for every module and belongs to none: it owns no
    # table, writes nothing and draws the theme's own notfound.tpl.
    mod_notfound.php {
      require '// @route '
      require 'class mod_notfound implements Module {'
      deny '@startup'
    }
  }

  dir modules/{module} {
    README.md
    templates/
    templates_c/

    # A module that owns no table has neither, and modules/dashboard is the
    # one. Presence is the weaker check of the two that hold this: semgrep
    # refuses a statement outside modules/*/storage/, and TestFront_Modules
    # reads setTables() against what schema/*.up.sql creates, both ways.
    ?schema/*.up.sql
    ?storage/*.php

    # Generated beside the schema, where tables() names a table.
    ?schema.puml
    ?schema.svg

    # The module's own stylesheet and script, its data model classes, the
    # prose the generator cannot write, and the files a run of it reads.
    ?assets/
    ?code/
    ?docs/
    ?action/
    ?api/

    modinfo.php {
      require '@startup'
      require 'new Task\Module'
      require 'Task::register($module);'
      deny '@route'
    }

    mod_{submodule}.php {
      require '// @route '
      require 'class mod_{submodule} implements Module {'
    }
  }

  # An endpoint of api/ routes and declares nothing: the class is the page's,
  # under mod_*.php, and a JSON answer is a function of this file.
  #
  # The route is not required here, because a module may bind its paths in
  # api/routes.php instead of annotating each file, and ruleslint has no way
  # to say either of two rules. docs/phpfront.md names it.
  dir modules/{module}/api {
    *.php {
      deny 'class '
      deny 'implements Module'
    }
  }

  linters {
    git ls-files -co --exclude-standard | xargs semgrep scan --metrics=off --quiet --error --config semgrep
  }
}
