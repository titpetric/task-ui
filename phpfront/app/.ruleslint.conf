ruleslint {
  name: TaskUI php app structure

  dir {
    modules
    theme
  }

  dir modules {
    artifacts/
    dashboard/
    folders/
    inventory/
    notfound/
    refinement/
    runs/
    schedules/
    settings/
    threads/
    user/
    workflows/
  }

  dir theme {
    assets/
    templates/
    templates_c/
  }

  dir modules/{module} {
    README.md
    schema/*.up.sql
    storage/*.php
    templates/
    templates_c/

    modinfo.php {
      require: '@startup'
      require: 'new Task\Module'
      require: 'Task::register($module);'
      deny: '@route'
    }

    mod_{submodule}.php {
      require: '// @route '
      require: 'class mod_{submodule} implements Module {'
    }
  }

  # An endpoint of api/ routes and declares nothing: the class is the page's,
  # under mod_*.php, and a JSON answer is a function of this file.
  #
  # The route is not required here, because a module may bind its paths in
  # api/routes.php instead of annotating each file, and ruleslint has no way
  # to say either of two rules. docs/phpfront.md names it.
  dir modules/{module}/api {
    *.php {
      deny: 'class '
      deny: 'implements Module'
    }
  }

  linters {
    git ls-files -co --exclude-standard | xargs semgrep scan --metrics=off --quiet --error --config semgrep
  }
}
