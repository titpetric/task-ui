ruleslint {
  name: TaskUI php app structure

  dir {
    modules
    theme
  }

  dir modules {
    artifacts/
    dashboard/
    folders/
    inventory/
    notfound/
    refinement/
    runs/
    schedules/
    settings/
    threads/
    user/
    workflows/
  }

  dir theme {
    assets/
    templates/
    templates_c/
  }

  dir modules/{module} {
    README.md
    schema/*.up.sql
    storage/*.php
    templates/
    templates_c/

    modinfo.php {
      contains: '@startup'
      contains: 'new Task\Module'
      contains: 'Task::register($module);'
    }

    mod_{submodule}.php {
      contains: '@route'
      contains: 'class mod_{submodule} implements Module {'
    }
  }

  linters {
    git ls-files -co --exclude-standard | xargs semgrep scan --metrics=off --quiet --error --config semgrep
  }
}
