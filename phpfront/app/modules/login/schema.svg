@startuml
hide circle
hide empty members
skinparam linetype ortho
skinparam shadowing false
skinparam backgroundColor transparent
entity "user" {
  * id : text
  + name : text
  + role : TEXT
  + folders : text
  + created_at : timestamp
  + updated_at : timestamp
  + admin : boolean
  + mcp : boolean
  + agent_reply : boolean
}

@enduml

