link refinement_comment to refinement_correction--><!--MD5=[49e793ee6ab50b3dc36554f48d350dfd]
link refinement_comment to refinement_thread--><!--MD5=[4aae574a46e400aeae5a95b26459f4ba]
@startuml
hide circle
hide empty members
skinparam linetype ortho
skinparam shadowing false
skinparam backgroundColor transparent
entity "refinement_comment" {
  * id : text
  + thread_id : text
  + user : text
  + body : text
  + note_id : text
  + created_at : timestamp
  + kind : text
  + collapsed_into : text
}

entity "refinement_correction" {
  * id : text
  + thread_id : text
  + comment_id : text
  + corrects_id : text
  + created_at : timestamp
}

entity "refinement_thread" {
  * id : text
  + title : text
  + user : text
  + report_markdown : text
  + created_at : timestamp
  + updated_at : timestamp
}

@enduml

