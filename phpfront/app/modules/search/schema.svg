link search_document to search_section--><!--MD5=[1744ab7ecf9d8329cae2c94a650abbc2]
link search_document to search_term--><!--MD5=[ceb6695e30700c8cc603707e5ff2870c]
@startuml
hide circle
hide empty members
skinparam linetype ortho
skinparam shadowing false
skinparam backgroundColor transparent
entity "search_document" {
  * id : text
  + kind : text
  + path : text
  + file : text
  + folder_id : text
  + workspace : text
  + project : text
  + target : text
  + name : text
  + dir : text
  + title : text
  + hash : text
  + size : integer
  + modified_at : timestamp
  + indexed_at : timestamp
}

entity "search_section" {
  * document_id : text
  * ordinal : integer
  + level : integer
  + heading : text
  + breadcrumb : text
  + line : integer
  + body : text
}

entity "search_term" {
  * document_id : text
  * ordinal : integer
  * term : text
  + weight : integer
}

@enduml

