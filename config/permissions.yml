# Each section gets these rules. Creating, rotating, exporting and
# managing keys count as edit; replies and states edit a note or prompt.
rules:
  all: "Allow All"
  view: "Allow View"
  edit: "Allow Edits"
  delete: "Allow Deletes"

sections:
  workspace: "Workspaces"
  project: "Projects"
  note: "Notes"
  prompt: "Prompts"
  workflow: "Workflows"
  schedule: "Schedules"
  artifact: "Artifacts"
  secret: "Secrets"
  key: "Instance Keys"
  integration: "Integrations"
  inventory: "Inventory"
  user: "Users"

# A section may add rules of its own under extra, <section>: <rule>:
# <title>; its all leaves them out, so each needs an allow of its own.
# None does.

# What a user may do in the application, beyond the sections.
permissions:
  run: "Run Jobs"
  shell: "Enter Shell"
  hosts: "Run on Hosts"
  input: "Allow interactive mode"
  # Opening a module is one capability and not a section: every module
  # shares it, and a module is installed by putting its directory under a
  # root rather than through a page, so there is nothing here to edit or
  # delete. What a module then does is the rule of whoever asked for it:
  # a run it starts runs as that user.
  module: "Open Modules"
