StylesPath = .vale/styles
MinAlertLevel = suggestion

# One style, vendored under .vale/styles, so the lint needs no network and
# reports the same findings on every machine. The thirty-nine rules came from
# titpetric/phpscript, where five of them carry their write-good upstream and
# licence in their own header.
#
# Markdown, Go, PHP, JavaScript and CSS in one section, because a doc comment
# is prose wherever it is written. vale reads the comments out of the four
# source languages and the whole of a markdown file. splint parses the Go,
# `phpscript lint` reports undefined names and unused variables in the PHP, and
# neither of them reads a sentence.
[*.{md,go,php,js,css}]
BasedOnStyles = llm-slop

# Three trees nobody here writes. An agent worktree is a checkout of these same
# files, so counting one multiplies every finding by the number of worktrees;
# composer writes a module's vendor directory, at any depth; and testdata holds
# the demo instance's fixtures.
#
# scripts/vale-gate.sh hands vale the file list git reports, so the gate skips
# these without reading this file at all. These sections are for the runs that
# walk the tree instead: `vale .` by hand.
[.claude/**]
BasedOnStyles =

[**/vendor/**]
BasedOnStyles =

[testdata/**]
BasedOnStyles =

# Generated documents. mig writes schema/docs and schema.yml from the
# migrations, mig gen writes model/types.mig.go, and README.md comes out of
# README.md.tpl through README.md.sh. Rewriting any of them edits the output
# instead of the source.
[schema/docs/**]
BasedOnStyles =

[model/types.mig.go]
BasedOnStyles =

[README.md]
BasedOnStyles =
