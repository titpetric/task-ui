StylesPath = .vale/styles
MinAlertLevel = suggestion

# One style, vendored under .vale/styles, so the lint needs no network and
# reports the same findings on every machine. The thirty-nine rules came from
# titpetric/phpscript, where five of them carry their write-good upstream and
# licence in their own header.
#
# This file follows malta/dockerfiles/vale/vale.ini, the config the
# registry.cdn.si/vale image bakes in and lints every repository with. The
# image does not read a repository's own config, so a finding the two disagree
# on is a finding CI reports and the local gate does not.
#
# Go reads as markdown, which is what gives a rule's scope something to resolve
# against. Without it vale writes no summary scope for a Go file, and
# MetricsInProse, which is scoped to a paragraph, passes every doc comment it
# is pointed at.
#
# A template carries no format and reads line by line. A .tpl is not HTML: a
# MiniTPL tag opens inside an attribute and inside a tag name, so the HTML
# reader drops the text it cannot place. Measured over the 209 templates of
# phpfront and frontend/view:
#
# | Format     | Findings | What it does not read                                 |
# |------------|----------|-------------------------------------------------------|
# | none       | 59       | a heading scope and a paragraph scope, so CompoundSubject and MetricsInProse never resolve |
# | tpl = html | 44       | every attribute value, and the text of a pre or code element |
# | tpl = md   | 30       | every indented line, taken for a code block           |
#
# A placeholder, a title and an aria-label are prose a reader sees. The two
# rules a line-by-line read gives up fired on markup alone here, joining an h3
# to the small inside it.
[formats]
go = md

# Markdown, Go, PHP, JavaScript, CSS and the templates in one section, because
# a doc comment is prose wherever it is written and a label is prose wherever
# it is drawn. vale reads the comments out of the source languages and the
# whole of a markdown file or a template. splint parses the Go, `phpscript
# lint` reports undefined names and unused variables in the PHP, and neither of
# them reads a sentence.
[*.{md,go,php,js,css,tpl}]
BasedOnStyles = llm-slop

# Five trees nobody here writes. An agent worktree is a checkout of these same
# files, so counting one multiplies every finding by the number of worktrees;
# composer writes a module's vendor directory, at any depth, and a phpscript
# tree names that directory `ext` (phpfront/app/composer.json); templates_c
# holds what the MiniTPL compiler wrote; and testdata holds the demo
# instance's fixtures.
#
# The lint job in atkins.yml hands vale the file list git reports, so the gate
# skips these without reading this file at all. These sections are for the runs
# that walk the tree instead: `vale .` by hand.
[.claude/**]
BasedOnStyles =

[{**/vendor/**,**/ext/**,**/templates_c/**}]
BasedOnStyles =

[testdata/**]
BasedOnStyles =

# Generated documents. mig writes schema/docs and schema.yml from the
# migrations, mig gen writes model/types.mig.go, and README.md comes out of
# README.md.tpl through README.md.sh. Rewriting any of them edits the output
# instead of the source.
[schema/docs/**]
BasedOnStyles =

[model/types.mig.go]
BasedOnStyles =

[README.md]
BasedOnStyles =
