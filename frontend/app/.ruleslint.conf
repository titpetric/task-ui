ruleslint {
  name: TaskUI php app structure

  dir {
    modules
    theme
  }

  dir modules {
    artifacts/
    dashboard/
    folders/
    inventory/
    login/
    mcp/
    notfound/
    profile/
    refinement/
    runs/
    schedules/
    settings/
    threads/
    workflows/
  }

  dir theme {
    dao/
    templates/
    templates_c/
    index.php
  }

  dir modules/{module} {
    dao/
    templates/
    templates_c/
    schema/*.up.sql

    api/*.php {
      contains: '@route'
    }

    modinfo.php {
      contains: 'new Task\Module'
    }

    index.php {
      contains: 'class mod_{module} {'
      contains: 'function get*'
    }

    mod_{submodule}.php {
      contains: 'class mod_{submodule} {'
    }
  }

  dir modules/{module}/dao {
    index.php {
      contains: 'class {module}_dao {'
    }
  }

  linters {
    git ls-files -co --exclude-standard | xargs semgrep scan --metrics=off --quiet --error --config semgrep
  }
}
