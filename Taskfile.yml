---
version: "3"

# Every go command here runs with a 1 GiB soft memory limit: a race-enabled
# test binary can grow past what the machine has.
env:
  GOMEMLIMIT: 1GiB

includes:
  docker: docker/Taskfile.yml

tasks:
  default:
    desc: "Run everything"
    cmds:
      - task: fix
      - task: lint
      - task: install
      - task: test

  test:
    desc: "Test task-ui"
    cmds:
      - CGO_ENABLED=1 go test -race -count=1 -cover ./...
      - CGO_ENABLED=0 go test -count=1 -cover ./...

  run:
    desc: "Run task-ui over the demo projects"
    env:
      TASK_UI_ROOT: testdata/demo
      TASK_UI_DATA: .data
      TASK_UI_AUTOLOGIN: admin
    cmds:
      - go run .

  docs:shots:
    desc: "Regenerate the README screenshots"
    cmds:
      - scripts/demo.sh

  smoke:
    desc: "Exercise a fresh instance end to end, the browser console included"
    cmds:
      - scripts/smoke.sh

  lint:
    desc: "Lint with splint and rulelint, zero findings is the bar"
    cmds:
      - splint ./...
      - go run ./internal/cmd/rulelint

  install:
    desc: "Install task-ui"
    cmds:
      - CGO_ENABLED=0 go install .

  fix:
    desc: "Fix code"
    deps:
      - deps:splint
    cmds:
      - splint fix ./...
      - go vet ./...
      - go mod tidy
      - ./README.md.sh > README.md

  deps:splint:
    internal: true
    status:
      - type splint
    cmds:
      - go install github.com/titpetric/tools/splint@main
