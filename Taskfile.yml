---
version: "3"

includes:
  docker: docker/Taskfile.yml

tasks:
  default:
    desc: "Run everything"
    cmds:
      - task: fix
      - task: lint
      - task: install
      - task: test

  test:
    desc: "Test task-ui"
    cmds:
      - CGO_ENABLED=1 go test -race -count=1 -cover ./...
      - CGO_ENABLED=0 go test -count=1 -cover ./...

  run:
    desc: "Run task-ui over the demo projects"
    env:
      TASK_UI_ROOT: testdata/demo
      TASK_UI_ASSETS: .
    cmds:
      - go run .

  docs:shots:
    desc: "Regenerate the README screenshots"
    cmds:
      - scripts/demo.sh

  lint:
    desc: "Lint with splint, zero findings is the bar"
    cmds:
      - splint ./...

  install:
    desc: "Install task-ui"
    cmds:
      - CGO_ENABLED=0 go install .

  fix:
    desc: "Fix code"
    deps:
      - deps:splint
    cmds:
      - splint fix ./...
      - go vet ./...
      - go mod tidy
      - ./README.md.sh > README.md

  deps:splint:
    internal: true
    status:
      - type splint
    cmds:
      - go install github.com/titpetric/tools/splint@main
