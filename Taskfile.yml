---
version: "3"

# Every go command here runs with a 1 GiB soft memory limit, so a test
# binary does not grow past what the machine has.
env:
  GOMEMLIMIT: 1GiB

includes:
  docker: docker/Taskfile.yml

tasks:
  default:
    desc: "Run everything"
    cmds:
      - task: fix
      - task: lint
      - task: install
      - task: test

  test:
    desc: "Run the unit tests"
    cmds:
      - go test ./...

  test:scope:
    desc: "Run the tests of what changed, inside the 1s per test budget"
    summary: |
      The packages a change touched and the packages that import them, from
      git and go list, with every test held to a second. Takes the flags of
      scripts/test.sh: task test:scope -- --all
    cmds:
      - scripts/test.sh {{.CLI_ARGS}}

  test:duplicate:
    desc: "Report the coverage two tests share"
    cmds:
      - scripts/test-duplicate.sh {{.CLI_ARGS}}

  test:integration:
    desc: "Run the integration tests: the storage package over a throwaway database"
    summary: |
      One go test per package, batched by test name, under a memory cap, so a
      package that holds more than the cap fits cannot take the suite down.
      Takes a package pattern: task test:integration -- ./storage/...
    cmds:
      - scripts/test-integration.sh {{.CLI_ARGS}}

  test:cover:
    desc: "Report unit test coverage per package"
    cmds:
      - go test -cover ./...

  test:coverage:
    desc: "Report every suite's duration and coverage, and the merged total"
    summary: |
      Runs the suites one at a time: the unit tests, the storage integration
      tests, the module's PHP fixtures and the two screenshot suites, whose
      server is built with go build -cover so a browser driving a real
      instance counts. Leaves cover/merged.txt.
      Takes suite names: task test:coverage -- unit storage
    cmds:
      - scripts/test-coverage.sh {{.CLI_ARGS}}

  test:memory:
    desc: "Run one test per process and report its peak memory"
    summary: |
      Answers whether one test is heavy or every test is heavy together. A
      suite whose tests are each small while the package is large is a leak
      between them. Takes a package pattern: task test:memory -- ./storage
    cmds:
      - scripts/test-memory.sh {{.CLI_ARGS}}

  run:
    desc: "Run task-ui over the demo projects"
    env:
      TASK_UI_WORKSPACE: testdata/demo
      TASK_UI_DATA: .data
      TASK_UI_AUTOLOGIN: admin
    cmds:
      - go run .

  test:pages:
    desc: "Compare every page of a demo instance against the ported front end"
    summary: |
      Builds the server, serves testdata/demo from throwaway instances, seeds
      them through the API and starts real runs, then crawls every link and
      compares every page it reached against the Go pages, as the admin and
      again as the viewer. The exit code is the count that differ.
      The screenshots are left alone: the filter matches no shot name.
    env:
      TASK_UI_SHOT_FILTER: "^$"
    cmds:
      - scripts/demo.sh

  docs:shots:
    desc: "Regenerate the README screenshots, crawling and comparing on the way"
    cmds:
      - scripts/demo.sh

  lint:
    desc: "Lint with splint, rulelint and vale, zero findings is the bar"
    cmds:
      - splint ./...
      - go run ./internal/cmd/rulelint

  lint:docs:
    desc: "Report the prose findings of the markdown, Go, PHP, JavaScript and CSS"
    cmds:
      - git ls-files --cached --others --exclude-standard | grep -E '\.(md|go|php|js|css)$' | xargs -r vale

  install:
    desc: "Install task-ui"
    cmds:
      - CGO_ENABLED=0 go install .

  fix:
    desc: "Fix code"
    deps:
      - deps:splint
    cmds:
      - splint fix ./...
      - go vet ./...
      - go mod tidy
      - ./README.md.sh > README.md

  deps:splint:
    internal: true
    status:
      - type splint
    cmds:
      - go install github.com/titpetric/tools/splint@main
