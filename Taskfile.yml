---
version: "3"

# Every go command here runs with a 1 GiB soft memory limit, so a test
# binary does not grow past what the machine has.
env:
  GOMEMLIMIT: 1GiB

includes:
  docker: docker/Taskfile.yml

tasks:
  default:
    desc: "Run everything"
    cmds:
      - task: fix
      - task: lint
      - task: install
      - task: test

  test:
    desc: "Run the unit tests"
    cmds:
      - go test ./...

  test:integration:
    desc: "Run the integration tests: processes, databases and the network"
    summary: |
      One go test per package, batched by test name, under a memory cap, so a
      package that holds more than the cap fits cannot take the suite down.
      Takes a package pattern: task test:integration -- ./storage/...
    cmds:
      - scripts/test-integration.sh {{.CLI_ARGS}}

  test:cover:
    desc: "Report unit test coverage per package"
    cmds:
      - go test -cover ./...

  run:
    desc: "Run task-ui over the demo projects"
    env:
      TASK_UI_WORKSPACE: testdata/demo
      TASK_UI_DATA: .data
      TASK_UI_AUTOLOGIN: admin
    cmds:
      - go run .

  docs:shots:
    desc: "Regenerate the README screenshots"
    cmds:
      - scripts/demo.sh

  lint:
    desc: "Lint with splint, rulelint and vale, zero findings is the bar"
    cmds:
      - splint ./...
      - go run ./internal/cmd/rulelint

  lint:docs:
    desc: "Report the prose findings of the markdown, Go, PHP, JavaScript and CSS"
    cmds:
      - git ls-files --cached --others --exclude-standard | grep -E '\.(md|go|php|js|css)$' | xargs -r vale

  install:
    desc: "Install task-ui"
    cmds:
      - CGO_ENABLED=0 go install .

  fix:
    desc: "Fix code"
    deps:
      - deps:splint
    cmds:
      - splint fix ./...
      - go vet ./...
      - go mod tidy
      - ./README.md.sh > README.md

  deps:splint:
    internal: true
    status:
      - type splint
    cmds:
      - go install github.com/titpetric/tools/splint@main
