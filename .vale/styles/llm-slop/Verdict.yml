---
extends: existence
message: "'%s' is a verdict on the fact before it. Delete it or name both sides."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bthat is the (?:cost|price|trade|tradeoff|trade-off) of\b'
  - '\ba small price to pay\b'
  - '\bworth it\b'
  # The appended form only. "OK (by design)" is a defined status in
  # docs/allocation-performance.md, and every row using it states the reason.
  - ',\s*by design\b'
  - '\b(?:is|are|was|were) by design\b'
  - '\bwhich is by design\b'
  - '\bthis is the (?:tradeoff|trade-off|compromise)\b'
  - '\bdeliberate(?:ly)?\b'
  - '\bon purpose\b'
  - '\bthe only (?:genuine|real|honest|true) (?:answer|way|option)\b'
  - '\bthe one that matters\b'
  - '\bthe (?:part|thing|figure|row|column) (?:that|which) matters\b'
  - '\bwhat really matters\b'
  - '\bthe wrong (?:thing|move|call)\b'
  - '\bis the whole (?:problem|story|of it)\b'
