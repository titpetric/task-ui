  - '\bopen questions?\b'
  - '\bneeds review\b'
  - '\breviewer note\b'
  - '\bI would appreciate\b'
  - '\bfeel free to\b'
  - '\bnote that\b'
  - '\bkeep in mind\b'
  - '\bbear in mind\b'
  - '\bbe aware\b'
  - '\byou (?:may|might) want to\b'
