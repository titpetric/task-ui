#!/usr/bin/env atkins
# Atkins: https://github.com/titpetric/atkins

name: refinement

# The module's own pipeline. `.` reads the PHP directly in a directory and
# `./...` reads it and everything below.
#
# The paths are named rather than globbed from the root for two reasons: the
# compiled templates under templates_c are generated PHP, which the formatter
# would rewrite and the next precompile would write back, and ext/ is what
# `composer install` put there, which is upstream's to format and not ours.
jobs:
  default:
    desc: "Format, lint, test and precompile"
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: precompile

  # `phpscript fmt -l` exits zero whether or not it listed a file, so the
  # check is whether it printed anything. Without the test this job reports
  # success over an unformatted tree.
  fmt:
    desc: "Fail if phpscript fmt would rewrite a file"
    steps:
      - |
        out="$(phpscript fmt -l . ./stubs/... ./code/... ./tests/...)"
        if [ -n "${out}" ]; then
            echo "phpscript fmt would rewrite:" >&2
            echo "${out}" >&2
            exit 1
        fi
        echo "every file is formatted"

  # --include registers the names the module's own files do not declare:
  # composer's autoloader for the MiniTPL classes, and stubs/ for the host
  # bindings, which are Go and invisible to a linter reading PHP. Without it
  # every `new Task\Module` reports as an undefined class and a real one reads
  # as more of the same noise.
  lint:
    desc: "Lint the module"
    steps:
      - phpscript lint --include stubs/autoload.php .
      - phpscript lint --include stubs/autoload.php ./code/...
      - phpscript lint --include stubs/autoload.php ./stubs/...
      - phpscript lint --include stubs/autoload.php ./tests/...

  # The fixtures of tests/, each one about a function that stands without
  # task-ui. phpscript.yml at the module root is what puts their application
  # root here instead of in tests/, so a fixture reads the tree index.php
  # reads. docs/testing.md has the rest.
  test:
    desc: "Run the module's test fixtures"
    steps:
      - phpscript test ./tests/...

  precompile:
    desc: "Compile the templates into templates_c"
    steps:
      - phpscript run precompile.php
